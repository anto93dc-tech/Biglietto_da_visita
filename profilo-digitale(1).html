<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antonio Di Crescenzo · ATLAS COPCO</title>
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#14202b;--mute:#667585;--line:#e3e8ed;--brand:#0093be;--brand-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1015;--card:#16202a;--ink:#eef3f7;--mute:#97a6b4;--line:#263340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1015;--card:#16202a;--ink:#eef3f7;--mute:#97a6b4;--line:#263340;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;background:var(--card);min-height:100vh;padding-bottom:32px}
.cover{height:132px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand),#000 38%));border-radius:0 0 30px 30px;padding:20px}
.logo{display:inline-block;background:#fff;border-radius:12px;padding:8px 12px;line-height:0}
.logo.img{background:none;padding:0}
.logo img{max-height:74px;max-width:100%;display:block;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.av{width:100px;height:100px;border-radius:50%;border:4px solid var(--card);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:34px;font-weight:700;margin:-54px auto 0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.head{text-align:center;padding:12px 20px 0}
h1{margin:0;font-size:25px;line-height:1.15}
.role{margin:6px 0 0;color:var(--mute)}
.org{margin:2px 0 0;font-weight:700;color:var(--brand);letter-spacing:.3px}
.cta{display:flex;gap:10px;padding:20px}
.btn{flex:1;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px 10px;border-radius:14px;cursor:pointer;text-align:center;text-decoration:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.item{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ic{flex:none;width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--brand) 14%,transparent);display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--brand)}
.item.wa .ic{background:#25d36626}
.item small{display:block;color:var(--mute);font-size:12px}
.item b{font-weight:500;word-break:break-word}
details{margin:8px 20px 0;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--mute);padding:10px 0}
.hint{color:var(--mute);font-size:14px;margin:0 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg .btn{padding:10px}
.seg .on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:14px;line-height:0}
#qr svg{width:230px;height:230px}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <div class="cover"><div class="logo" id="logo"></div></div>
  <div class="av" id="av"></div>
  <div class="head"><h1 id="name"></h1><p class="role" id="role"></p><p class="org" id="org"></p></div>
  <div class="cta">
    <button class="btn pri" id="save">Salva contatto</button>
    <button class="btn" id="qrBtn">QR code</button>
  </div>
  <div id="list"></div>
  <details>
    <summary>Scrivi su un tag NFC</summary>
    <p class="hint">Solo per il proprietario: avvicina il retro del telefono a un tag NFC (Android, Chrome). Chi toccherà il tag aprirà questo profilo.</p>
    <div class="btns"><button class="btn pri" id="nfcLink">Scrivi link profilo</button><button class="btn" id="nfcVcf">Scrivi contatto</button></div>
    <p class="hint" id="nfcMsg" style="margin-top:10px"></p>
  </details>
</main>

<div class="modal hide" id="modal">
  <div class="sheet">
    <div class="seg"><button class="btn on" id="mLink">Link profilo</button><button class="btn" id="mVcf">Contatto</button></div>

    <p class="hint" style="margin-top:12px" id="qrHint"></p>
    <div class="btns"><button class="btn" id="shareBtn">Condividi link</button><button class="btn" id="close">Chiudi</button></div>
  </div>
</div>

"ORG:"+esc(D.org),"TITLE:"+esc(D.role),"TEL;TYPE=CELL:"+num,"EMAIL:"+D.mail].concat(D.web?["URL:"+D.web]:[],D.addr?["ADR:;;"+esc(D.addr)+";;;;"]:[],["END:VCARD"]).join("\n")}
document.documentElement.style.setProperty("--brand",D.color);
$("logo").className=D.logo?"logo img":"logo";$("logo").innerHTML=D.logo?'<img alt="Atlas Copco" src="'+D.logo+'">':LOGO0;
$("av").innerHTML=D.photo?'<img alt="" src="'+D.photo+'">':((D.first[0]||"")+(D.last[0]||"")).toUpperCase();
$("name").textContent=D.first+" "+D.last;$("role").textContent=D.role;$("org").textContent=D.org;
var rows=[["📞","Cellulare",D.tel,"tel:"+num,""],
["💬","WhatsApp","Scrivimi su WhatsApp","https://wa.me/"+num.replace(/\D/g,"")+"?text="+encodeURIComponent("Ciao "+D.first+", ti scrivo dal tuo biglietto da visita digitale."),"wa"],
["✉️","Email",D.mail,"mailto:"+D.mail,""],
["🌐","Sito web",D.web.replace(/^https?:\/\//,""),D.web,""],
["in","LinkedIn",D.linkedin.replace(/^https?:\/\/(www\.)?/,""),D.linkedin,""],
["📍","Indirizzo",D.addr,"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(D.addr),""]];
rows.forEach(function(r){if(!r[2])return;var a=document.createElement("a");a.className="item "+r[4];a.href=r[3];a.target="_blank";a.rel="noopener";
a.innerHTML='<span class="ic"></span><span><small></small><b></b></span>';
a.querySelector(".ic").textContent=r[0];a.querySelector("small").textContent=r[1];a.querySelector("b").textContent=r[2];$("list").appendChild(a)});
/* QR */
var mode="link";
function drawQr(){var t=mode==="link"?PUBLIC_URL:vcf();
try{var q=qrcode(0,"M");q.addData(t);q.make();$("qr").innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){$("qr").textContent="QR non disponibile"}
$("mLink").classList.toggle("on",mode==="link");$("mVcf").classList.toggle("on",mode!=="link");
$("qrHint").textContent=mode==="link"?"Inquadra con la fotocamera per aprire il profilo.":"Inquadra con la fotocamera per salvare subito il contatto in rubrica.";}
function openQr(){drawQr();$("modal").classList.remove("hide")}
$("qrBtn").onclick=openQr;$("close").onclick=function(){$("modal").classList.add("hide")};
$("mLink").onclick=function(){mode="link";drawQr()};$("mVcf").onclick=function(){mode="vcf";drawQr()};
$("shareBtn").onclick=function(){if(navigator.share){navigator.share({title:D.first+" "+D.last,text:D.role+" · "+D.org,url:PUBLIC_URL}).catch(function(){})}
else if(navigator.clipboard){navigator.clipboard.writeText(PUBLIC_URL).then(function(){$("shareBtn").textContent="Link copiato ✓"})}};
/* Salva contatto */
$("save").onclick=async function(){
  try{var f=new File([vcf()],D.first+"-"+D.last+".vcf",{type:"text/vcard"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Contatto"});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  mode="vcf";openQr();
};
/* NFC */
async function nfc(rec){var m=$("nfcMsg");
  if(!("NDEFReader" in window)){m.textContent="Scrittura NFC non supportata qui: usa Chrome su Android, con NFC attivo.";return}
  try{m.textContent="Avvicina il telefono al tag…";await new NDEFReader().write({records:[rec]});m.textContent="Fatto! Tag programmato ✓"}
  catch(e){m.textContent="Scrittura non riuscita ("+(e&&e.message?e.message:"riprova")+"). Apri la pagina a schermo intero in Chrome e riprova."}}
$("nfcLink").onclick=function(){nfc({recordType:"url",data:PUBLIC_URL})};
$("nfcVcf").onclick=function(){nfc({recordType:"mime",mediaType:"text/vcard",data:new TextEncoder().encode(vcf())})};
</script>
</body>
</html>
